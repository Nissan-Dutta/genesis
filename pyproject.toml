[project]
name = "pgnoise"
version = "0.1.0"
description = "Rank uncertainty and benchmark-design statistics for the ProteinGym DMS-substitution leaderboard"
readme = "README.md"
authors = [{ name = "Nissan Dutta" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.6",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "scipy==1.16.2",
]

[project.optional-dependencies]
esm = [
    "fair-esm==2.0.0",
    "torch==2.8.0",
]

[project.urls]
Homepage = "https://github.com/Nissan-Dutta/genesis"
Repository = "https://github.com/Nissan-Dutta/genesis"

[project.scripts]
pgnoise = "pgnoise.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
